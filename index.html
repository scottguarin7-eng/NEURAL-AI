<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural Ultra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: white;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #164e63, transparent 35%),
        radial-gradient(circle at 80% 80%, #312e81, transparent 35%),
        #050713;
    }

    .card {
      width: min(760px, 100%);
      padding: 48px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 32px;
      background: rgba(255,255,255,.1);
      box-shadow: 0 30px 100px rgba(0,0,0,.35);
      backdrop-filter: blur(24px);
    }

    .orb {
      width: 110px;
      height: 110px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, white, #62f5ff 12%, #7c3aed 70%);
      box-shadow: 0 0 60px rgba(98,245,255,.7);
      animation: pulse 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.5rem);
      letter-spacing: -0.06em;
    }

    p {
      color: rgba(255,255,255,.65);
      font-size: 1.1rem;
    }

    button {
      margin-top: 20px;
      padding: 13px 22px;
      border: 0;
      border-radius: 999px;
      background: #62f5ff;
      color: #041018;
      font-weight: bold;
      cursor: pointer;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 100px rgba(98,245,255,.9);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="orb"></div>
    <h1>Neural Ultra</h1>
    <p>Your AI workspace is ready.</p>
    <button onclick="showMessage()">Initialize Engine</button>
    <p id="status"></p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("status").textContent =
        "Neural Ultra engine initialized.";
    }
  </script>
</body>
</html>
